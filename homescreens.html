<!DOCTYPE html><html lang='de'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Stundenpläne</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
.wrapper{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
.card{background:#1d1d1d;border-radius:12px;padding:8px}
h2{text-align:center}
</style>
</head><body>
<div class="wrapper">
<div class="card"><h2>Jojo</h2><div id="jojoTable"></div></div>
<div class="card"><h2>Jooris</h2><div id="joorisTable"></div></div>
<div class="card"><h2>Jule</h2><div id="juleTable"></div></div>
</div>
<script src="js/config.js"></script>
<script src="js/parser.js"></script>
<script src="js/sheets.js"></script>
<script src="js/table.js"></script>
<script src="js/schedule.js"></script>
<script>
async function load(id,url){const d=await loadSheet(url);createTable(d,id);}
(async()=>{await Promise.all([
load("jojoTable",CONFIG.sheets.jojo),
load("joorisTable",CONFIG.sheets.jooris),
load("juleTable",CONFIG.sheets.jule)]);
["jojoTable","joorisTable","juleTable"].forEach(highlightCurrentLesson);
setInterval(location.reload.bind(location),300000);
})();
</script></body></html>
