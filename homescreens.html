<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Böder SchoolBoard – Homescreens</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/homescreens.css">

</head>

<body class="homescreens">

<div class="dashboard">

    <div class="plan-card">

        <h2>Jojo</h2>

        <div id="jojoTable" class="table-container"></div>

    </div>

    <div class="plan-card">

        <h2>Jooris</h2>

        <div id="joorisTable" class="table-container"></div>

    </div>

    <div class="plan-card">

        <h2>Jule</h2>

        <div id="juleTable" class="table-container"></div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/parser.js"></script>
<script src="js/sheets.js"></script>
<script src="js/table.js"></script>
<script src="js/highlight.js"></script>
<script src="js/app.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

    await Promise.all([

        loadAndDisplay(CONFIG.sheets.jojo, "jojoTable"),
        loadAndDisplay(CONFIG.sheets.jooris, "joorisTable"),
        loadAndDisplay(CONFIG.sheets.jule, "juleTable")

    ]);

    highlightCurrentLesson("jojoTable");
    highlightCurrentLesson("joorisTable");
    highlightCurrentLesson("juleTable");

    setInterval(async () => {

        await Promise.all([

            loadAndDisplay(CONFIG.sheets.jojo, "jojoTable"),
            loadAndDisplay(CONFIG.sheets.jooris, "joorisTable"),
            loadAndDisplay(CONFIG.sheets.jule, "juleTable")

        ]);

        highlightCurrentLesson("jojoTable");
        highlightCurrentLesson("joorisTable");
        highlightCurrentLesson("juleTable");

    }, 300000);

});

</script>

</body>
</html>
