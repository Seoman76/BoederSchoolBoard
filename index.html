 <!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Böder SchoolBoard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="header">

        <div class="logo">
            🏫 Böder SchoolBoard
        </div>

        <div class="headerRight">

            <div id="weather">
                🌤 Wetter wird geladen...
            </div>

            <div id="date">
                Datum
            </div>

            <div id="clock">
                --:--
            </div>

        </div>

    </header>

    <!-- ==========================================
         DASHBOARD
    =========================================== -->

    <main>

        <section class="board">

            <h2>👦 Jojo</h2>

            <div id="jojoTable">

                Lade Stundenplan...

            </div>

        </section>

        <section class="board">

            <h2>👦 Jooris</h2>

            <div id="joorisTable">

                Lade Stundenplan...

            </div>

        </section>

        <section class="board">

            <h2>👧 Jule</h2>

            <div id="juleTable">

                Lade Stundenplan...

            </div>

        </section>

    </main>

    <!-- ==========================================
         STATUS
    =========================================== -->

    <footer>

        <div id="status">

            ✅ Böder SchoolBoard v0.2.3 Foundation

        </div>

    </footer>

    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/config.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/sheets.js"></script>
    <script src="js/table.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
