<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>CSV-Test</title>
</head>
<body>

<h1>Google Sheets Test</h1>

<pre id="output">Lade Daten...</pre>

<script>
const url = "https://docs.google.com/spreadsheets/d/1ravA7izByD4IN7aUhxsMNQ7mn185jvYYFLlQUnAXFDM/gviz/tq?tqx=out:csv&gid=0";

fetch(url)
  .then(response => response.text())
  .then(text => {
      document.getElementById("output").textContent = text;
  })
  .catch(error => {
      document.getElementById("output").textContent = error;
  });
</script>

</body>
</html>
